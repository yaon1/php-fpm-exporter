services:
  app:
    image: php:8.4-fpm-alpine
    volumes:
      - ./app:/var/www/html:ro
      - ./fpm.conf:/usr/local/etc/php-fpm.d/zz-status.conf:ro
    command: sh -c "docker-php-ext-enable opcache 2>/dev/null; php-fpm"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ['8088:80']
    depends_on: [app]

  exporter:
    build: ..
    environment:
      FPM_STATUS_URLS: www=tcp://app:9000/status
      OPCACHE_STATUS_URLS: www=tcp://app:9000/var/www/html/opcache-status.php
    ports: ['9253:9253']
    depends_on: [app]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts/php-fpm.rules.yml:/etc/prometheus/rules/php-fpm.yml:ro
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
